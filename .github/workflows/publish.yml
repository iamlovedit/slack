name: Publish

on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: |
        dotnet publish src/Slack/Slack.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true --self-contained true -o publish/${{ matrix.rid }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: slack-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          cd "$name"
          if [ -f "slack" ]; then
            tar -czvf "../${name}.tar.gz" slack
          elif [ -f "slack.exe" ]; then
            zip -r "../${name}.zip" slack.exe
          fi
          cd ..
        done
        ls -la

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
